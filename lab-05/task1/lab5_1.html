<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 1 — План подорожі</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page">
    <div class="trip">
        <h1 class="trip__title">План подорожі:</h1>

        <ul class="list list--level1">
            <li class="list__item list__item--level1">
                <span class="tag tag--level1">Підготовчий етап</span>
                <ul class="list list--level2">
                    <li class="list__item list__item--level2 icon-route"><span class="tag tag--level2">Обрати маршрут</span></li>
                    <li class="list__item list__item--level2 icon-tickets"><span class="tag tag--level2">Квитки на літак</span></li>
                    <li class="list__item list__item--level2 icon-hotel"><span class="tag tag--level2">Готель</span></li>
                    <li class="list__item list__item--level2 icon-car"><span class="tag tag--level2">Оренда авто</span></li>
                </ul>
            </li>
        </ul>

        <ul class="list list--level1">
            <li class="list__item list__item--level1">
                <span class="tag tag--level1">Відпочинок</span>
                <ul class="list list--level2">
                    <li class="list__item list__item--level2 icon-bars"><span class="tag tag--level2">Бари</span></li>
                    <li class="list__item list__item--level2 icon-casino"><span class="tag tag--level2">Казино</span></li>
                    <li class="list__item list__item--level2 icon-museums"><span class="tag tag--level2">Музеї</span></li>
                    <li class="list__item list__item--level2 icon-festivals"><span class="tag tag--level2">Фестивалі</span></li>
                </ul>
            </li>
        </ul>
    </div>
</body>
</html>

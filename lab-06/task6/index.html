<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page">
<header class="top-bar">
    <nav class="top-links" aria-label="Quick links">
        <a class="top-link" href="#">Mail</a>
        <a class="top-link" href="#">Images</a>
    </nav>

    <div class="toolbar">
        <div class="app-launcher">
            <input class="popup-toggle" type="checkbox" id="popup-button" aria-label="Open applications">
            <label class="popup-button" for="popup-button" aria-label="Applications menu">
                    <span class="apps-glyph" aria-hidden="true">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                    </span>
            </label>

            <section class="apps-popup" aria-label="Applications">
                <div class="popup-scroll" tabindex="0" aria-label="Scrollable applications panel">
                    <div class="apps-grid">
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--calendar" aria-hidden="true"></span>
                            <span class="app-name">Calendar</span>
                        </button>
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--mail" aria-hidden="true"></span>
                            <span class="app-name">Mail</span>
                        </button>
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--news" aria-hidden="true"></span>
                            <span class="app-name">News</span>
                        </button>
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--map" aria-hidden="true"></span>
                            <span class="app-name">Map</span>
                        </button>
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--files" aria-hidden="true"></span>
                            <span class="app-name">Files</span>
                        </button>
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--contacts" aria-hidden="true"></span>
                            <span class="app-name">Contacts</span>
                        </button>
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--translate" aria-hidden="true"><span>A 文</span></span>
                            <span class="app-name">Translate</span>
                        </button>
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--videos" aria-hidden="true"><span>▶</span></span>
                            <span class="app-name">Videos</span>
                        </button>
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--search" aria-hidden="true"><span>GO!</span></span>
                            <span class="app-name">Search</span>
                        </button>
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--photos" aria-hidden="true"><span></span><span></span><span></span></span>
                            <span class="app-name">Photos</span>
                        </button>
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--apps" aria-hidden="true"></span>
                            <span class="app-name">Apps</span>
                        </button>
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--documents" aria-hidden="true"></span>
                            <span class="app-name">Documents</span>
                        </button>
                    </div>

                    <input class="more-toggle" type="checkbox" id="more-toggle" aria-label="Show more applications">
                    <label class="more-button" for="more-toggle"><span>More</span></label>

                    <div class="extra-apps">
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--chat" aria-hidden="true">☷</span>
                            <span class="app-name">Chat</span>
                        </button>
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--classroom" aria-hidden="true">+ − = ?</span>
                            <span class="app-name">Classroom</span>
                        </button>
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--collection" aria-hidden="true">✱</span>
                            <span class="app-name">Collection</span>
                        </button>
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--mars" aria-hidden="true">•</span>
                            <span class="app-name">Mars</span>
                        </button>
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--blogs" aria-hidden="true"></span>
                            <span class="app-name">Blogs</span>
                        </button>
                        <button class="app-link" type="button">
                            <span class="app-icon app-icon--promos" aria-hidden="true">◀))</span>
                            <span class="app-name">Promos</span>
                        </button>
                    </div>
                    <div class="expanded-footer">Even more from Kottans</div>
                </div>
            </section>
        </div>

        <button class="notification-button" type="button" aria-label="Notifications">
            <span class="bell-icon" aria-hidden="true"></span>
        </button>
        <button class="profile-button" type="button" aria-label="Profile">
            <span class="profile-avatar" aria-hidden="true"> </span>
        </button>
    </div>
</header>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather widget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="weather">
    <div class="card">
        <span class="card-label">Today</span>
        <span class="temp">17</span>
    </div>

    <div class="cloud"></div>

    <div class="arrows">
        <button class="arrow arrow-prev" type="button">&larr;</button>
        <button class="arrow arrow-next" type="button">&rarr;</button>
    </div>

    <ul class="forecast">
        <li class="day">
            <span class="day-name">Mon</span>
            <span class="day-temp">17&deg;</span>
            <span class="day-tip">Cloudy</span>
        </li>
        <li class="day">
            <span class="day-name">Tue</span>
            <span class="day-temp">19&deg;</span>
            <span class="day-tip">Partly sunny</span>
        </li>
        <li class="day">
            <span class="day-name">Wed</span>
            <span class="day-temp">16&deg;</span>
            <span class="day-tip">Rain</span>
        </li>
        <li class="day">
            <span class="day-name">Thu</span>
            <span class="day-temp">18&deg;</span>
            <span class="day-tip">Cloudy</span>
        </li>
        <li class="day">
            <span class="day-name">Fri</span>
            <span class="day-temp">21&deg;</span>
            <span class="day-tip">Sunny</span>
        </li>
    </ul>
</div>
</body>
</html>

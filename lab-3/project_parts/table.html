<!DOCTYPE html>
<html lang="en">
<head>
    <style type="text/css">
        table { border-collapse: collapse; width: 640px;}
        td { border: 3px solid #000; }
        tr {width: 80px; height: 80px; }
    </style>
    <meta charset="UTF-8">
    <title>Завдання 1: Table</title>
</head>
<body>
    <table>
        <tr>
            <td colspan="8" bgcolor="aqua"></td>
        </tr>

        <tr>
            <td rowspan="6" bgcolor="#faebd7"></td>
            <td colspan="6" bgcolor="aqua"></td>
            <td rowspan="6" bgcolor="#faebd7"></td>
        </tr>

        <tr>
            <td rowspan="4" bgcolor="#faebd7"></td>
            <td colspan="4" bgcolor="aqua"></td>
            <td rowspan="4" bgcolor="#faebd7"></td>
        </tr>

        <tr>
            <td rowspan="2" bgcolor="#faebd7"></td>
            <td bgcolor="#E32636"></td>
            <td bgcolor="#0000FF"></td>
            <td rowspan="2" bgcolor="#faebd7"></td>
        </tr>

        <tr>
            <td bgcolor="#7FFF00"></td>
            <td bgcolor="#FDE910"></td>
        </tr>

        <tr>
            <td colspan="4" bgcolor="aqua"></td>
        </tr>

        <tr>
            <td colspan="6" bgcolor="aqua"></td>
        </tr>

        <tr>
            <td colspan="8" bgcolor="aqua"></td>
        </tr>
    </table>
    <a href="../index.html"> Повернутися на головну</a>

</body>
</html>
